<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>フィルタリング</title>
  <link rel="stylesheet" href="style.css">
  <!-- jQuery本体 -->

</head>

<body>
  <div id="wrapper">
    <h1>Filtering</h1>

    <div id="buttons">
      <button value="all" class="current">all</button>
      <button value="red">red</button>
      <button value="blue">blue</button>
      <button value="yellow">yellow</button>
      <button value="gray">gray</button>
      <button value="shirt">shirt</button>
      <button value="jacket">jacket</button>
      <button value="skirt">skirt</button>
      <button value="pants">pants</button>
    </div><!-- /#buttons -->

    <ul id="list">
      <li class="red skirt">
        <img src="img/subaru_BE5.jpg" alt="item1">
      </li>
      <li class="red jacket">
        <img src="img/subaru_22b.jpg" alt="item2">
      </li>
      <li class="red shirt">
        <img src="img/subaru_GDB.jpg" alt="item3">
      </li>
      <li class="red skirt">
        <img src="img/subaru_VAB.jpg" alt="item4">
      </li>
      <li class="red pants">
        <img src="img/toyota_AE86.jpg" alt="item5">
      </li>
      <li class="red shirt">
        <img src="img/toyota_mr2.png" alt="item6">
      </li>
      <li class="red shirt">
        <img src="img/toyota_70supra.jpg" alt="item7">
      </li>
      <li class="red pants">
        <img src="img/toyota_Chaser.jpg" alt="item8">
      </li>
      <li class="red jacket">
        <img src="img/nissan_s30z.jpg" alt="item9">
      </li>
      <li class="red shirt">
        <img src="img/nissan_180sx.jpg" alt="item10">
      </li>
      <li class="red skirt">
        <img src="img/nissan_s15.jpg" alt="item11">
      </li>
      <li class="red jacket">
        <img src="img/nissan_R32.png" alt="item12">
      </li>
    </ul><!-- /#list -->
  </div><!-- /#wrapper -->

  <script src="script.js"></script>
</body>

</html>
